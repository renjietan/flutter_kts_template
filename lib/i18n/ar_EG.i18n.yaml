  radioManager:
    alias:
      placeholder: 12 وحدة من الصينية أو الإنجليزية أو الأرقام أو المسافات أو العربية أو رموز نصف العرض
      validate: يرجى إدخال الاسم المستعار للجهاز
      invalid: يحتوي الاسم المستعار على أحرف غير مدعومة
      invalidLength: يجب أن يكون طول الاسم المستعار من 1 إلى 12 وحدة
      help: |
        1. تحسب كل حرف صيني أو عربي كوحدتين؛ ويحسب كل حرف إنجليزي أو رقم أو مسافة أو رمز نصف عرض كوحدة واحدة. الطول الإجمالي للاسم المستعار من 1 إلى 12 وحدة.
        2. يُسمح فقط بالصينية والعربية والأحرف الإنجليزية والأرقام والمسافات ورموز نصف العرض.
        3. لا يمكن أن يحتوي على \ / : * ? " < > |؛ ولا يمكن أن يبدأ أو ينتهي بمسافة أو نقطة؛ ولا يمكن أن يكون . أو .. فقط.
