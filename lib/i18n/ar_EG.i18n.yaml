      placeholder: 10 أحرف أو أرقام إنجليزية
      validate: يرجى إدخال رقم SN
      invalid: يجب أن يكون SN مكونًا من 10 أحرف أو أرقام
    location:
      placeholder: حتى 50 حرفًا إنجليزيًا أو رقمًا أو مسافة أو رمز "_"
      validate: لا يمكن أن يكون موقع جهاز الراديو فارغًا
