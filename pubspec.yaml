name: flutter_kts_template
description: "A new Flutter project."
# 需要发布时，需要修改地址
publish_to: 'none'

# Android 版本声明规则 https://developer.android.com/studio/publish/versioning
# IOS 版本声明规则 https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.0.0+1

environment:
  sdk: ^3.10.9

flutter_native_splash:
  # ... 其他配置
  android: false  # 禁用 Android 平台的启动页生成[reference:2][reference:3]
  ios: false      # 禁用 iOS 平台的启动页生成[reference:4][reference:5]
  web: false      # 禁用 Web 平台的启动页生成[reference:6][reference:7]


## APP 运行时，所用的包
dependencies:
  flutter:
    sdk: flutter
  ## 用于语言切换
  flutter_localizations:
    sdk: flutter
  # flutter 创建项目时，自带的包
  cupertino_icons: ^1.0.8

  ## 国际化
  slang: ^4.15.0
  ## 国际化-辅助-富文本
  slang_flutter: ^4.15.0
  ## 日志
  logger: ^2.7.0
  ## 服务器
  shelf: ^1.4.2
  ## shelf的辅助插件：路由-基础类
  shelf_router: ^1.1.4
  ## shelf的辅助插件：静态服务
  shelf_static: ^1.1.3
  ## shelf的辅助插件：文件上传
  shelf_essentials: ^1.0.1
  ## 向量数据库
  objectbox: ^5.3.2
  ## ObjectBox 在各个平台（如 iOS, Android）上运行的原生底层库，它是运行时的“引擎”，负责真正地读写数据
  ## ^5.3.2 | any
  objectbox_flutter_libs: ^5.3.2
  ## 集成数据时，顺带安装 =》 生成 创建数据库本地文件 的路径
  path_provider: ^2.1.5
  ## 用于各平台的路径拼接
  path: ^1.9.1
  ## 转 json
  json_annotation: ^4.12.0
  ## 路由-暂未使用
  go_router: ^17.3.0
  ## 状态管理器: Provider.of<UserInfoStore>(context, listen: false);
  provider: ^6.1.5+1
  ## 内存管理
  shared_preferences: ^2.5.5
  ## 响应式
  flutter_screenutil: ^5.9.3
  ## 接管 android studio 自带的 闪屏 页面
  flutter_native_splash: ^2.4.7

  ## tree 组件
  ## reorderable_tree_list_view: ^0.0.1
  ## 组件-备用
  ## super_tree: ^0.2.1
  recursive_tree_flutter: ^1.0.4

  ## 生成随机数据
  faker: ^2.2.0
  ## form表单
  flutter_form_builder: ^10.3.0+2
  ## form表单-参数验证
  form_builder_validators: ^11.3.0
  ## 弹窗
  flutter_smart_dialog: ^5.1.0
  ## 表格 + 分页
  composable_data_table: ^0.1.1
  ## 文件上传 - 不带 widget（废弃，使用 dio + file_picker 实现）
#  universal_file_picker: ^0.1.0
  ## 提示框 + loading
  unified_popups: ^1.2.2
  ## 前端网络库
  dio: ^5.9.2
  ## 移动端 权限申请
  permission_handler: ^12.0.3
  ## 文件选择
  file_picker: ^11.0.2
  ## 获取文件类型
  mime: ^2.0.0
  ## 解压压缩包
  archive: ^4.0.9
  ## udp 包
  udp: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  ## 代码书写遵循的规则集
  flutter_lints: ^6.0.0
  ## 生成工具：所有插件都可以使用它能生成代码 2.15.0
  build_runner: ^2.4.15
  ## 国际化生成工具: dart slang -d
  slang_build_runner: ^4.15.0
  ## 一键修改Android包名: dart run change_app_package_name:main com.hytera.flutter_kts_templtae
  change_app_package_name: ^1.5.0
  ## 阿里巴巴字体转图标: dart run iconfont_convert --config iconfont.yaml
  iconfont_convert: ^1.0.2
  ## 数据库表-代码生成功能： flutter pub run build_runner build --delete-conflicting-outputs
  ## ^5.3.2 | any
  objectbox_generator: ^5.3.2
  ## JSON 序列化生成器
  json_serializable: ^6.14.0
  # 路由
  go_router_builder: ^4.3.0
  # 重命名应用名称
  rename_app: ^1.6.6
  # 可单独使用，也可使用全局包 rebrand_cli 实现, 
  # 即便不使用 flutter_launcher_icons 包，也不可删除它，因为 rebrand_cli 依赖它
  flutter_launcher_icons: ^0.14.4
  # 打包
  inno_bundle: ^0.11.2

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # 自动将 Flutter SDK 自带的 Material Icons 字体文件打包进应用
  # 这样你就可以在代码中直接使用 Icons 类提供的所有图标
  uses-material-design: true

  # 字体: https://flutter.dev/to/font-from-package
  fonts:
    - family: HyIcons
      fonts:
        - asset: assets/iconfont/hy_icons.ttf

  assets:
    - assets/appbar/logo.png

#  flutter_native_splash:
#    background_image_android: "assets/launcher/background.png"
#    background_image_ios: "assets/launcher/background.png"
#    android_12:
#      image: "assets/launcher/android12.png"
#      icon_background_color: "#324ea1"
  # To add assets to your application, add an assets section, like this:
# assets:
#   - images/a_dot_burr.jpeg
#   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
