  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

inno_bundle:
  id: 95067000-843b-11f1-851e-e92e0c69ab82
  publisher: Cc
  name: "CPD"
  version: "1.0.0"
  exe_name: "CPD.exe"
  languages:
    - english
